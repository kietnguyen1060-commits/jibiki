<style>
/* Layout: sổ tay học tập — thanh điều hướng dính trên cùng, cột nội dung ~62rem; mỗi bài = ngữ pháp + kanji + từ vựng + một đề dạng JLPT N4. */
:root {

  }
}
:root[data-theme="dark"] {

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const rich = s => esc(s).replace(/&lt;(\/?)u&gt;/g, "<$1u>").replace(/★/g, '<span class="star">★</span>');
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const gLesson = id => id.split("-")[0];
  const nQ = b => D.tests[b].sections.reduce((a, s) => a + s.items.length, 0);
  const sum = f => L.reduce((a, b) => a + f(b), 0);

  function setNav(which) {
    document.querySelectorAll("[data-nav]").forEach(a => {
      if (a.dataset.nav === which) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });

  /* ---------- Đồng hồ làm đề ----------
     Thời gian lưu trong cùng bản ghi của đề (saved.tm): tải lại trang hay tạm dừng vẫn giữ đúng
     số giây đã làm. Mặc định ~0,75 phút mỗi câu, làm tròn 5 phút; chọn 0 = không giới hạn (đếm lên). */
  const fmt = s => {
    s = Math.max(0, Math.round(s));
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
    return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0");
  };
  function setupTimer(saved, save, total, onTimeout) {
    const tm = saved.tm = saved.tm || { len: Math.max(10, Math.round(total * 0.75 / 5) * 5), used: 0, at: 0 };
    const el = id => document.getElementById(id);
    const sel = el("tmrLen"), btn = el("tmrBtn"), out = el("tmrT"), box = el("tmr");
    const opts = [0, 10, 15, 20, 25, 30, 40, 50, 60, 75, 90];
    if (!opts.includes(tm.len)) opts.push(tm.len);
    sel.innerHTML = opts.sort((a, b) => a - b).map(m => `<option value="${m}" ${m === tm.len ? "selected" : ""}>${m ? m + " phút" : "Không giới hạn"}</option>`).join("");
    const used = () => tm.used + (tm.at ? (Date.now() - tm.at) / 1000 : 0);
    function draw() {
      const u = used(), left = tm.len * 60 - u;
      out.textContent = tm.len ? fmt(left) : fmt(u);
      box.classList.toggle("warn", !!tm.len && !!tm.at && left <= 300);
      box.classList.toggle("run", !!tm.at);
      btn.textContent = saved.done ? "Đã nộp" : tm.at ? "⏸ Tạm dừng" : u > 0 ? "▶ Tiếp tục" : "▶ Bắt đầu";
      btn.disabled = !!saved.done;
      sel.disabled = !!saved.done || u > 0;
      if (tm.len && tm.at && left <= 0) { stop(); onTimeout(); }
    }
    function start() { if (!tm.at && !saved.done) { tm.at = Date.now(); save(); draw(); } }
    function pause() { if (tm.at) { tm.used = used(); tm.at = 0; save(); } draw(); }
    function stop() { clearInterval(window.__tmr); pause(); return tm.used; }
    btn.addEventListener("click", () => tm.at ? pause() : start());
    sel.addEventListener("change", () => { tm.len = +sel.value; save(); draw(); });
    clearInterval(window.__tmr);
    window.__tmr = setInterval(draw, 1000);
    draw();
    return { start, stop };
  }
  // Ghi lần làm vào lịch sử của đề (mỗi lần nộp một dòng) và trả về khối "Thời gian" cho phần kết quả.
  function runInfo(key, saved, total) {
    const tm = saved.tm || {}, used = tm.used || 0;
    const hist = store.get(key + "-lich-su") || [];
    if (!saved.logged) {
      const d = new Date(), p = n => String(n).padStart(2, "0");
      hist.unshift({ d: `${p(d.getDate())}/${p(d.getMonth() + 1)} ${p(d.getHours())}:${p(d.getMinutes())}`, s: saved.score, n: total, t: Math.round(used), len: tm.len || 0 });
      store.set(key + "-lich-su", hist.slice(0, 20));
      saved.logged = true;
    }
    const over = tm.len && used >= tm.len * 60;
    return `<div><span class="eyebrow">Thời gian</span><div>${fmt(used)}${tm.len ? ` / ${tm.len} phút${over ? " · hết giờ, bài tự nộp" : ""}` : ""}</div></div>` +
      (hist.length ? `<details class="hist" ${hist.length > 1 ? "open" : ""}><summary>Các lần làm đề này (${hist.length})</summary><table><tr><th>Lúc</th><th>Điểm</th><th>Thời gian</th></tr>${hist.map(r => `<tr><td>${r.d}</td><td>${r.s}/${r.n}</td><td>${fmt(r.t)}${r.len ? " / " + r.len + "′" : ""}</td></tr>`).join("")}</table></details>` : "");
  }

  function home() {
    setNav("home");
    const words = sum(b => D.vocab[b].filter(w => !w[6]).length);
    let h = `<p class="eyebrow">Bộ tài liệu JLPT N4 theo giáo trình</p>
      <h1>みんなの日本語 初級Ⅱ</h1>
      <p class="lede">Ngữ pháp, kanji và từ vựng của 25 bài Minna no Nihongo Sơ cấp 2 (bài 26–50). Mỗi bài có một đề kiểm tra theo dạng đề JLPT N4, dùng toàn bộ từ vựng, mẫu ngữ pháp và kanji của bài đó.</p>
      <div class="stats">
        <div><b>25</b><span>bài · 25 đề</span></div>
        <div><b>${words.toLocaleString("vi")}</b><span>từ vựng</span></div>
        <div><b>${sum(b => (D.kanji[b] || []).length)}</b><span>kanji N4</span></div>
        <div><b>${sum(b => D.grammar[b].length)}</b><span>mẫu ngữ pháp</span></div>

      </div>
      <h2>Bài học và đề kiểm tra</h2><div class="lessons">`;
    L.forEach(b => {

        <small>${D.vocab[b].length} từ · ${D.grammar[b].length} mẫu · ${(D.kanji[b] || []).length} kanji</small>
        <span class="kj">${ks ? esc(ks) : "—"}</span>
        <a class="go" href="#de-${b}">Làm đề bài ${b} →</a></div>`;
    });
    h += `</div><h2>Cách dùng</h2><p class="note">Mở từng bài để học ngữ pháp, kanji và từ vựng. Học xong thì làm đề của bài đó, bấm <b>Nộp bài</b> để xem điểm, lời giải và các mẫu ngữ pháp cần ôn lại. Từ vựng lấy từ deck Anki "Minna II" của bạn. Kanji của mỗi bài là những chữ N4 (không tính khoảng 100 chữ N5) xuất hiện lần đầu trong từ vựng của bài đó, kèm âm Hán Việt và on/kun lấy từ deck Kanji Look and Learn. Tên riêng bạn đã tạm ngưng trong Anki được đánh dấu "tên riêng" và không bắt buộc trong đề. Câu trả lời được lưu trên trình duyệt này.</p>`;
    app.innerHTML = h;
  }

  function strip(cur, prefix) {
    return `<nav class="lesson-strip" aria-label="Chọn bài">${L.map(b => `<a href="#${prefix}-${b}" ${b === cur ? 'aria-current="page"' : ""}>${b}</a>`).join("")}</nav>`;
  }

  function lesson(b) {
    setNav("lesson");
    const words = D.vocab[b], gs = D.grammar[b], ks = D.kanji[b] || [];
    let h = strip(b, "bai") + `<p class="eyebrow">Bài ${b} · ${words.length} từ · ${gs.length} mẫu ngữ pháp · ${ks.length} kanji</p>
      <h1>第${b}課</h1>
      <div class="jump"><a class="btn" href="#bai-${b}" data-go="g">Ngữ pháp</a><a class="btn" href="#bai-${b}" data-go="k">Kanji</a><a class="btn" href="#bai-${b}" data-go="v">Từ vựng</a><a class="btn primary" href="#de-${b}">Làm đề bài ${b} →</a></div>
      <h2 id="sec-g">Ngữ pháp</h2><div class="grammar">`;
    gs.forEach(g => {
      h += `<article class="g-card"><header><span class="g-id">${g.id}</span><span class="g-pat">${esc(g.p)}</span><span class="g-mean">${esc(g.m)}</span></header>
        <p>${esc(g.n)}</p>${ssLinks(g.id)}${(g.bang || []).map(t => `<div class="chia"><b>${esc(t.t)}</b><div class="chia-wrap"><table class="${t.r.every(r => r[0].length <= 14) ? "ngan" : ""} ${t.h.length <= 3 ? "doc" : ""}"><thead><tr>${t.h.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${t.r.map(r => `<tr>${r.map(c => `<td>${esc(c).replace(/ ／ /g, "<br>")}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`).join("")}${g.luu ? `<ul class="luu">${g.luu.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}<div class="ex">${g.ex.map(e => `<div><span class="jp">${esc(e[0])}</span><small>${esc(e[1])}</small></div>`).join("")}</div></article>`;
    });
    h += `</div><h2 id="sec-k">Kanji <small>${ks.length ? "chữ N4 mới trong bài" : "bài này không có kanji mới, hãy ôn kanji các bài trước"}</small></h2>`;
    if (ks.length) {
      h += `<div class="kanji-grid">` + ks.map(x => `<div class="kcard"><span class="k">${esc(x.k)}</span>
        <span class="hv">${esc(x.hv)} <small>· ${esc(x.nghia)}</small></span>
        <span class="rd">音 ${esc(x.on || "—")}　訓 ${esc(x.kun || "—")}　${esc(x.net)} nét</span>
        <span class="tu">${esc(x.tu.join("、"))}</span></div>`).join("") + `</div>`;
    }
    h += `<h2 id="sec-v">Từ vựng</h2>
      <div class="tools"><input type="search" id="q-${b}" placeholder="Tìm từ, cách đọc hoặc nghĩa…" aria-label="Tìm từ vựng">
      <label class="toggle"><input type="checkbox" id="hide-${b}"> Che nghĩa để tự kiểm tra</label>
      <button class="btn" type="button" id="hidew-${b}" title="Toàn màn hình: nhìn nghĩa, viết từ lên bảng to rồi kiểm tra">✍ Che từ để tự viết</button></div>
      <div class="table-wrap"><table class="vocab" id="vt"><thead><tr><th>#</th><th>Từ</th><th>Nghĩa</th><th>Ví dụ</th></tr></thead><tbody>`;
    let sec = "";
    words.forEach((w, i) => {
      if (w[5] !== sec) { sec = w[5]; h += `<tr class="sec"><td colspan="4">${esc(sec)}</td></tr>`; }
      const main = w[0] || w[1], kana = w[0] ? w[1] : "";
      h += `<tr data-s="${esc((w[0] + " " + w[1] + " " + w[2]).toLowerCase())}"><td class="n">${i + 1}</td>
        <td class="word" data-k="${esc(w[0])}" data-r="${esc(w[1])}"><div class="w-main">${esc(main)}${w[6] ? '<span class="tag">tên riêng</span>' : ""}</div>${kana ? `<div class="w-kana">${esc(kana)}</div>` : ""}</td>
        <td class="mean">${esc(w[2])}</td><td class="ex-cell"><span class="jp">${esc(w[3])}</span><small>${esc(w[4])}</small></td></tr>`;
    });
    h += `</tbody></table></div>
      <div class="pager">${b > 26 ? `<a class="btn" href="#bai-${b - 1}">← Bài ${b - 1}</a>` : "<span></span>"}
      <a class="btn primary" href="#de-${b}">Làm đề bài ${b} →</a>${b < 50 ? `<a class="btn" href="#bai-${b + 1}">Bài ${b + 1} →</a>` : ""}</div>`;
    app.innerHTML = h;
    app.querySelectorAll("[data-go]").forEach(a => a.addEventListener("click", e => {
      e.preventDefault(); document.getElementById("sec-" + a.dataset.go).scrollIntoView({ behavior: "smooth" });
    }));
    const tbl = document.getElementById("vt");
    document.getElementById("q-" + b).addEventListener("input", e => {
      const v = e.target.value.trim().toLowerCase();
      tbl.querySelectorAll("tbody tr:not(.sec)").forEach(tr => { tr.hidden = v && !tr.dataset.s.includes(v); });
    });
    document.getElementById("hide-" + b).addEventListener("change", e => {
      tbl.classList.toggle("hide-mean", e.target.checked);
      tbl.querySelectorAll("td.mean").forEach(td => td.classList.remove("show"));
    });
    tbl.addEventListener("click", e => { const td = e.target.closest("td.mean"); if (td) td.classList.toggle("show"); });
    /* Che từ để tự viết — toàn màn hình, mỗi lần một từ (theo thứ tự bảng, chỉ các từ đang hiện khi lọc):
       nhìn nghĩa + câu dịch, viết lên bảng to kẻ ô 田, bấm Kiểm tra để hiện từ. Nét lưu theo tỉ lệ bề rộng bảng
       nên đổi cỡ màn hình (vào / ra toàn màn hình) không lệch. Trong app 字引 (trang ở /minna/…) nét được gửi cho
       /api/viet (Google) để chấm: đúng khi một trong 3 gợi ý đầu khớp chữ Hán hoặc cách đọc (bỏ qua ［…］, 〜,
       khoảng trắng); mở trang riêng thì chỉ hiện từ để tự so. */
    const coMay = /\/minna\/n[45]\.html$/.test(location.pathname);
    const chuan = x => String(x || "").replace(/[［\[][^］\]]*[］\]]/g, "").replace(/[〜～~\s　・]/g, "");
    const dapAn = w => [w[0], w[1]].flatMap(x => String(x || "").split(/[、,，]/)).map(chuan).filter(Boolean);
    async function docChu(strokes) {
      const t0 = strokes[0][0].t;
      const ink = strokes.map(st => [st.map(p => Math.round(p.x * 300)), st.map(p => Math.round(p.y * 300)), st.map(p => p.t - t0)]);
      const res = await fetch("/api/viet", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ink }) });
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }
    function vietToanManHinh(list) {
      const ov = document.createElement("div");
      ov.className = "vt-full"; ov.setAttribute("role", "dialog"); ov.setAttribute("aria-label", "Tự viết từ");
      ov.innerHTML = `<div class="vt-top"><span class="vt-pos"></span><span class="vt-score"></span><span class="vt-o" title="Số ô trên bảng: ít ô thì ô to">Số ô ${[4, 6, 8].map(n => `<button type="button" data-o="${n}">${n}</button>`).join("")}</span><button class="btn" type="button" data-a="thoat">✕ Thoát (Esc)</button></div>
        <div class="vt-q"><div class="vt-mean"></div><div class="vt-ex"></div></div>
        <div class="vt-board"><canvas aria-label="Bảng viết từ"></canvas></div>
        <div class="vt-ans" aria-live="polite"></div>
        <div class="vt-act"><button class="btn" type="button" data-a="truoc">← Trước</button><button class="btn" type="button" data-a="undo">↶ Xoá nét cuối</button><button class="btn" type="button" data-a="xoa">Xoá hết</button><button class="btn primary" type="button" data-a="kiem">Kiểm tra (Enter)</button><button class="btn primary" type="button" data-a="tiep" hidden>Tiếp → (Enter)</button></div>`;
      document.body.appendChild(ov);
      const $o = q => ov.querySelector(q), cv = $o("canvas"), ctx = cv.getContext("2d");
      const strokes = []; let cur = null, idx = 0, hien = false, W = 0, H = 0, oCount = 6;
      let soO = 6; try { soO = +localStorage.getItem("minna-so-o") || 6; } catch (e) {}
      const danhDauO = () => ov.querySelectorAll("[data-o]").forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.o === soO)));
      const kq = list.map(() => null);   // true / false / "tu" (tự so) / null (chưa làm)
      const css = v => getComputedStyle(ov).getPropertyValue(v).trim();
      function ve() {
        ctx.clearRect(0, 0, W, H);
        // Ô kẻ: viền vuông liền, chữ thập giữa ô nét đứt.
        const c = W / oCount;
        ctx.lineWidth = 1; ctx.strokeStyle = css("--line") || "#ccc"; ctx.setLineDash([]);
        for (let i = 1; i < oCount; i++) { ctx.beginPath(); ctx.moveTo(i * c, 0); ctx.lineTo(i * c, H); ctx.stroke(); }
        ctx.setLineDash([5, 6]); ctx.globalAlpha = .7;
        ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke();
        for (let i = 0; i < oCount; i++) { ctx.beginPath(); ctx.moveTo((i + .5) * c, 0); ctx.lineTo((i + .5) * c, H); ctx.stroke(); }
        ctx.setLineDash([]); ctx.globalAlpha = 1;
        ctx.strokeStyle = ctx.fillStyle = css("--ink") || "#1b1b1b"; ctx.lineCap = ctx.lineJoin = "round";
        [...strokes, ...(cur ? [cur] : [])].forEach(st => {
          const P = st.map(p => ({ x: p.x * W, y: p.y * W, w: p.w * c }));
          if (P.length === 1) { ctx.beginPath(); ctx.arc(P[0].x, P[0].y, P[0].w / 2, 0, 7); ctx.fill(); return; }
          for (let i = 1; i < P.length; i++) {
            const p0 = i === 1 ? P[0] : { x: (P[i - 2].x + P[i - 1].x) / 2, y: (P[i - 2].y + P[i - 1].y) / 2 };
            const a = P[i - 1], q = P[i], m = i === P.length - 1 ? q : { x: (a.x + q.x) / 2, y: (a.y + q.y) / 2 };
            ctx.lineWidth = (a.w + q.w) / 2;
            ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.quadraticCurveTo(a.x, a.y, m.x, m.y); ctx.stroke();
          }
        });
      }
      function fit() {
        const bw = $o(".vt-board").clientWidth;
        oCount = Math.max(3, Math.min(soO, Math.floor(bw / 80)));   // ô không nhỏ hơn 80px (màn hình hẹp)
        W = bw;
        // Ô vuông, nhưng không cao quá phần màn hình còn lại (để nút bấm vẫn thấy).
        const rest = window.innerHeight - (ov.scrollHeight - cv.clientHeight) - 8;
        H = Math.max(90, Math.min(W / oCount, rest > 90 ? rest : W / oCount));
        const dpr = Math.max(1, window.devicePixelRatio || 1);
        cv.style.height = H + "px"; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ve();
      }
      const diem = e => {
        const r = cv.getBoundingClientRect(), p = e.pointerType === "pen" && e.pressure > 0 ? e.pressure : 0.5;
        return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.width, w: 0.025 + p * 0.045, t: Math.round(performance.now()) };
      };
      cv.addEventListener("pointerdown", e => { if (e.button > 0 || hien) return; e.preventDefault(); cv.setPointerCapture(e.pointerId); cur = [diem(e)]; ve(); });
      cv.addEventListener("pointermove", e => {
        if (!cur) return;
        const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
        (evs.length ? evs : [e]).forEach(ev => { const p = diem(ev), l = cur[cur.length - 1]; if (Math.hypot(p.x - l.x, p.y - l.y) * W >= 1) cur.push(p); });
        ve();
      });
      const het = () => { if (cur) { strokes.push(cur); cur = null; ve(); } };
      cv.addEventListener("pointerup", het); cv.addEventListener("pointercancel", het);
      function diem_so() {
        const cham = kq.filter(x => x === true || x === false).length, dung = kq.filter(x => x === true).length;
        $o(".vt-score").textContent = cham ? `Đúng ${dung}/${cham}` : "";
      }
      function moTu(i) {
        idx = i; hien = false; strokes.length = 0; cur = null;
        const w = list[i];
        $o(".vt-pos").textContent = `Từ ${i + 1}/${list.length}`;
        $o(".vt-mean").textContent = w[2];
        $o(".vt-ex").textContent = w[4] || "";
        $o(".vt-ans").innerHTML = "";
        $o('[data-a="kiem"]').hidden = false; $o('[data-a="tiep"]').hidden = true;
        $o('[data-a="truoc"]').disabled = i === 0;
        $o(".vt-board").hidden = false; $o(".vt-act").hidden = false; $o(".vt-q").hidden = false;
        diem_so(); fit();
      }
      async function kiem() {
        if (hien) return;
        hien = true;
        const w = list[idx], main = w[0] || w[1], kana = w[0] ? w[1] : "";
        const tu = `<div class="vt-word">${esc(main)}</div>${kana ? `<div class="vt-kana">${esc(kana)}</div>` : ""}${w[3] ? `<div class="vt-exjp">${esc(w[3])}</div>` : ""}`;
        $o('[data-a="kiem"]').hidden = true; $o('[data-a="tiep"]').hidden = false;
        if (!strokes.length) { $o(".vt-ans").innerHTML = `<div class="vt-res">Từ cần viết:</div>${tu}`; return; }
        if (!coMay) { kq[idx] = "tu"; $o(".vt-ans").innerHTML = `<div class="vt-res">So chữ bạn viết với từ này:</div>${tu}`; return; }
        $o(".vt-ans").innerHTML = `<div class="vt-res">Đang đọc chữ…</div>`;
        let cands;
        try { cands = await docChu(strokes); }
        catch (e) { $o(".vt-ans").innerHTML = `<div class="vt-res">Không đọc được chữ (mất mạng) — tự so với từ này:</div>${tu}`; return; }
        const ans = dapAn(w), dung = cands.slice(0, 3).map(chuan).some(c => ans.includes(c));
        kq[idx] = dung;
        $o(".vt-ans").innerHTML = `<div class="vt-res ${dung ? "ok" : "no"}">${dung ? "✓ Đúng rồi!" : `✗ Chưa đúng — máy đọc ra ${esc(cands[0] || "?")}`}</div>${tu}`;
        diem_so();
      }
      function ketThuc(dsSai) {
        const cham = kq.filter(x => x === true || x === false).length, dung = kq.filter(x => x === true).length;
        $o(".vt-board").hidden = true; $o(".vt-act").hidden = true; $o(".vt-q").hidden = true;
        $o(".vt-pos").textContent = "Xong";
        $o(".vt-ans").innerHTML = `<div class="vt-end"><div class="vt-mean">Xong ${list.length} từ${cham ? ` · đúng ${dung}/${cham}` : ""}</div>
          ${dsSai.length ? `<ul>${dsSai.map(w => `<li><span class="vt-word">${esc(w[0] || w[1])}</span> — ${esc(w[2])}</li>`).join("")}</ul>` : ""}
          <div class="vt-act">${dsSai.length ? '<button class="btn primary" type="button" data-a="lai">Viết lại các từ sai</button>' : ""}<button class="btn" type="button" data-a="thoat">Thoát</button></div></div>`;
      }
      function tiep() {
        if (idx < list.length - 1) return moTu(idx + 1);
        ketThuc(list.filter((w, i) => kq[i] === false));
      }
      function thoat() {
        if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
        window.removeEventListener("resize", fit); document.removeEventListener("fullscreenchange", fit); document.removeEventListener("keydown", phim, true);
        ov.remove();
      }
      function phim(e) {
        if (e.key === "Escape") { e.preventDefault(); thoat(); }
        else if (e.key === "Enter" && !$o(".vt-board").hidden) { e.preventDefault(); hien ? tiep() : kiem(); }
        else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); if (!hien) { strokes.pop(); ve(); } }
      }
      ov.addEventListener("click", e => {
        const o = e.target.closest("[data-o]");
        if (o) { soO = +o.dataset.o; try { localStorage.setItem("minna-so-o", soO); } catch (er) {} danhDauO(); fit(); return; }
        const a = e.target.closest("[data-a]"); if (!a) return;
        const act = a.dataset.a;
        if (act === "thoat") thoat();
        else if (act === "truoc" && idx > 0) moTu(idx - 1);
        else if (act === "undo" && !hien) { strokes.pop(); ve(); }
        else if (act === "xoa" && !hien) { strokes.length = 0; ve(); }
        else if (act === "kiem") kiem();
        else if (act === "tiep") tiep();
        else if (act === "lai") { const sai = list.filter((w, i) => kq[i] === false); thoat(); vietToanManHinh(sai); }
      });
      window.addEventListener("resize", fit); document.addEventListener("fullscreenchange", fit); document.addEventListener("keydown", phim, true);
      // Toàn màn hình nếu trình duyệt cho phép (trong khung không cho thì vẫn phủ kín trang).
      if (ov.requestFullscreen) ov.requestFullscreen().catch(() => {});
      danhDauO(); moTu(0);
    }
    document.getElementById("hidew-" + b).addEventListener("click", () => {
      const rows = [...tbl.querySelectorAll("tbody tr:not(.sec)")];
      const list = words.filter((w, i) => rows[i] && !rows[i].hidden);
      if (list.length) vietToanManHinh(list);
    });
  }

  function test(b) {
    setNav("test");
    const t = D.tests[b], cov = D.coverage[b];
    const key = "minna-n4-de-" + b;
    const saved = store.get(key) || { ans: {}, done: false };
    const all = [];
    let h = strip(b, "de") + `<div class="test-head"><div><p class="eyebrow">Bài ${b} · dạng đề JLPT N4</p><h1>${esc(t.title)}</h1></div>
      <div class="badges"><span class="badge">Từ vựng ${cov.vocab[0]}/${cov.vocab[1]}</span><span class="badge">Ngữ pháp ${cov.grammar[0]}/${cov.grammar[1]}</span><span class="badge">Kanji ${cov.kanji[0]}/${cov.kanji[1]}</span></div></div>
      <div class="bar"><div class="progress"><i id="prog"></i></div><span class="count" id="cnt"></span>
      <span class="timer" id="tmr" title="Đồng hồ làm đề"><b id="tmrT"></b><select id="tmrLen" aria-label="Thời gian làm bài"></select><button class="btn" id="tmrBtn" type="button"></button></span><button class="btn primary" id="submit" type="button">Nộp bài</button><button class="btn" id="reset" type="button">Làm lại</button></div>
      <div id="res"></div>`;
    let part = "", n = 0;
    t.sections.forEach((s, si) => {
      if (s.part !== part) { part = s.part; h += `<div class="part-head"><span class="jp">${part}</span><span>${PARTS[part] || ""}</span></div>`; }
      h += `<section class="sec"><h3>${esc(s.title)}</h3><p class="instr">${esc(s.instr)}</p>`;
      if (s.passage) h += `<div class="passage">${esc(s.passage)}</div>`;
      s.items.forEach((it, ii) => {
        n++;
        const qid = `${si}-${ii}`;
        all.push({ qid, it, part: s.part });
        const long = it.o.some(o => o.length > 16);
        h += `<div class="q" data-q="${qid}"><div class="stem"><span class="num">${n}</span><span class="text">${rich(it.q)}</span></div><div class="opts${long ? " long" : ""}" role="radiogroup" aria-label="Câu ${n}">`;
        it.o.forEach((o, oi) => {
          const iid = `t${b}-q${qid}-o${oi}`;
          h += `<label class="opt" for="${iid}"><input type="radio" id="${iid}" name="t${b}-q${qid}" value="${oi}" ${saved.ans[qid] === oi ? "checked" : ""}><span class="k">${oi + 1}</span><span>${esc(o)}</span></label>`;
        });
        const tags = (it.g || []).filter(g => D.grammar[gLesson(g)]).map(g => `<a href="#bai-${gLesson(g)}" title="Xem mẫu ${g}">${g}</a>`).join("");
        h += `</div><div class="fb"><span class="mark"></span>${it.full ? `<span class="full">${esc(it.full)}</span><br>` : ""}${esc(it.e || "")}${tags ? `<span class="tags">${tags}</span>` : ""}</div></div>`;
      });
      h += `</section>`;
    });
    h += `<div class="pager"><a class="btn" href="#bai-${b}">← Ôn bài ${b}</a>${b < 50 ? `<a class="btn" href="#de-${b + 1}">Đề bài ${b + 1} →</a>` : ""}</div>`;
    app.innerHTML = h;
    document.documentElement.style.setProperty("--hh", document.querySelector("header.top").offsetHeight + "px");
    const total = all.length;
    function refresh() {
      const c = Object.keys(saved.ans).length;
      document.getElementById("prog").style.width = (100 * c / total) + "%";
      document.getElementById("cnt").textContent = `${c}/${total} câu`;
    }
    let timer = null;
    function grade() {
      let score = 0; const per = {}; const weak = new Set();
      all.forEach(({ qid, it, part }) => {
        const box = app.querySelector(`[data-q="${qid}"]`), chosen = saved.ans[qid];
        per[part] = per[part] || [0, 0]; per[part][1]++;
        const ok = chosen === it.a;
        if (ok) { score++; per[part][0]++; } else (it.g || []).forEach(g => weak.add(g));
        box.classList.add("done");
        box.querySelectorAll(".opt").forEach((l, oi) => {
          l.classList.toggle("correct", oi === it.a);
          l.classList.toggle("wrong", oi === chosen && !ok);
          l.querySelector("input").disabled = true;
        });
        const m = box.querySelector(".mark");
        m.className = "mark " + (ok ? "ok" : "no");
        m.textContent = ok ? "Đúng." : chosen === undefined ? `Chưa trả lời · đáp án ${it.a + 1}.` : `Sai · đáp án ${it.a + 1}.`;
      });
      saved.done = true; saved.score = score; store.set(key, saved);
      const pct = Math.round(100 * score / total);
      const weakList = [...weak].filter(g => D.grammar[gLesson(g)]).sort((x, y) => x.localeCompare(y, undefined, { numeric: true }));
      document.getElementById("res").innerHTML = `<div class="result"><div><span class="eyebrow">Kết quả</span><div class="score">${score}/${total} · ${pct}%</div></div>
        <div class="parts">${Object.entries(per).map(([p, v]) => `<span>${PARTS[p]} <b>${v[0]}/${v[1]}</b></span>`).join("")}</div>
        ${weakList.length ? `<div><span class="eyebrow">Mẫu ngữ pháp nên ôn lại</span><div class="weak">${weakList.map(g => `<a href="#bai-${gLesson(g)}">${g}</a>`).join("")}</div></div>` : `<div>Không sai câu nào về ngữ pháp. Rất tốt!</div>`}</div>`;
      document.getElementById("submit").disabled = true;
      if (timer) timer.stop();
      document.querySelector("#res .result").insertAdjacentHTML("beforeend", runInfo(key, saved, total));
      store.set(key, saved);
    }
    app.onchange = e => {
      const inp = e.target.closest('input[type="radio"]');
      if (!inp || saved.done) return;
      saved.ans[inp.closest(".q").dataset.q] = Number(inp.value);
      store.set(key, saved); refresh();
      if (timer) timer.start();  // chọn đáp án đầu tiên là bắt đầu tính giờ
    };
    document.getElementById("submit").addEventListener("click", () => {
      grade(); document.getElementById("res").scrollIntoView({ behavior: "smooth", block: "start" });
    });
    document.getElementById("reset").addEventListener("click", () => { store.set(key, { ans: {}, done: false }); test(b); });
    refresh();
    timer = setupTimer(saved, () => store.set(key, saved), total, () => {
      grade(); document.getElementById("res").scrollIntoView({ behavior: "smooth", block: "start" });
    });
    if (saved.done) grade();
  }

  /* ---------- So sánh ngữ pháp N5 – N4 ----------
     Dữ liệu dùng chung cho hai trang (minna-n4/data/so-sanh-n5-n4.json). Mẫu cùng trình độ mở ngay trong trang;
     mẫu của trình độ kia mở được khi trang chạy trong app 字引 (trang nằm ở /minna/n4.html hay /minna/n5.html). */
  const SS = D.soSanh || [];
  const CAP = "N4";
  const inApp = /\/minna\/n[45]\.html$/.test(location.pathname);
  const ssByG = {};
  SS.forEach(g => g.mau.forEach(m => (ssByG[m.g] = ssByG[m.g] || []).push(g)));
  function mauLink(m) {
    const label = `${m.cap} · bài ${m.bai} · ${m.g}`;
    if (m.cap === CAP) return `<a class="ss-cap ${m.cap}" href="#bai-${m.bai}">${label}</a>`;
    return inApp ? `<a class="ss-cap ${m.cap}" href="/#minna-${m.cap.toLowerCase()}/bai-${m.bai}" target="_top">${label}</a>` : `<span class="ss-cap ${m.cap}">${label}</span>`;
  }
  const ssLinks = gid => (ssByG[gid] || []).map(g => `<p class="ss-link">↔ So sánh với mẫu giống: <a href="#so-sanh/${g.id}">${esc(g.ten.split(":")[0])}</a></p>`).join("");
  function soSanh(id) {
    setNav("so-sanh");
    let h = `<p class="eyebrow">Ngữ pháp N5 – N4</p><h1>So sánh mẫu dễ nhầm</h1>
      <p class="lede">${SS.length} nhóm mẫu giống nghĩa giữa Minna I (N5) và Minna II (N4): khác nhau ở đâu, dùng trong trường hợp nào, mẹo chọn.</p>
      <nav class="ss-toc" aria-label="Các nhóm so sánh">${SS.map(g => `<a href="#so-sanh/${g.id}">${esc(g.ten.split(":")[0])}</a>`).join("")}</nav>`;
    SS.forEach(g => {
      h += `<section class="ss-group" id="ss-${g.id}"><h2>${esc(g.ten)}</h2><p class="lede">${esc(g.tom)}</p>
        <div class="ss-grid">${g.mau.map(m => `<article class="ss-mau"><header>${mauLink(m)}<span class="g-pat">${esc(m.p)}</span></header>
          <p>${esc(m.y)}</p><div class="ex"><div><span class="jp">${esc(m.vd[0])}</span><small>${esc(m.vd[1])}</small></div></div></article>`).join("")}</div>
        <div class="ss-khac"><b>Khác nhau thế nào</b><ul class="luu">${g.khac.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
        <p class="ss-meo"><b>Mẹo chọn:</b> ${esc(g.meo)}</p></section>`;
    });
    app.innerHTML = h;
    const el = id && document.getElementById("ss-" + id);
    if (el) [0, 400].forEach(t => setTimeout(() => el.scrollIntoView(), t));  // lần 2: chờ phông chữ dựng xong
  }

  function route() {
    app.onchange = null;
    clearInterval(window.__tmr);
    const h = location.hash.replace("#", "");
    let m;
    if ((m = h.match(/^bai-(\d+)$/)) && D.tests[m[1]]) lesson(+m[1]);
    else if ((m = h.match(/^de-(\d+)$/)) && D.tests[m[1]]) test(+m[1]);
    else if ((m = h.match(/^so-sanh(?:\/([\w-]+))?$/))) soSanh(m[1]);
    else home();
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
